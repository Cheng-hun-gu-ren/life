    <!-- API模块 - 必须在main.js之前加载 -->
    <script src="../../js/api.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/animations.js"></script>
    <script src="../../js/background.js"></script>
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // 先加载数据（调整子页面路径）
                await loadSubPageData();
                
                // 渲染马拉松内容
                renderMarathon();
                
                console.log('人生旅程页面初始化完成');
            } catch (error) {
                console.error('页面初始化失败:', error);
            }
        });
        
        // 子页面数据加载函数
        async function loadSubPageData() {
            try {
                // 检查是否有LifeAPI可用
                if (typeof LifeAPI !== 'undefined') {
                    console.log('🚀 人生旅程页面使用API加载数据...');
                    
                    // 使用API加载数据
                    const allData = await LifeAPI.loadAllData();
                    
                    booksData = allData.books;
                    moviesData = allData.movies;
                    musicData = allData.music;
                    marathonData = allData.marathon;
                    
                    console.log('✅ 人生旅程API数据加载完成:', allData);
                } else {
                    console.log('📁 人生旅程页面回退到JSON文件加载...');
                    
                    // 回退到JSON文件加载
                    const [books, movies, music, marathon] = await Promise.all([
                        loadJSON('../../data/books.json'),
                        loadJSON('../../data/movies.json'),
                        loadJSON('../../data/music.json'),
                        loadJSON('../../data/marathon.json')
                    ]);
                    
                    booksData = books;
                    moviesData = movies;
                    musicData = music;
                    marathonData = marathon;
                    
                    console.log('📁 人生旅程JSON数据加载完成');
                }
            } catch (error) {
                console.error('❌ 人生旅程数据加载失败:', error);
                
                // API失败时尝试JSON回退
                if (typeof LifeAPI !== 'undefined') {
                    try {
                        console.log('🔄 尝试JSON文件回退...');
                        const [books, movies, music, marathon] = await Promise.all([
                            loadJSON('../../data/books.json'),
                            loadJSON('../../data/movies.json'),
                            loadJSON('../../data/music.json'),
                            loadJSON('../../data/marathon.json')
                        ]);
                        
                        booksData = books;
                        moviesData = movies;
                        musicData = music;
                        marathonData = marathon;
                        
                        console.log('📁 JSON回退成功');
                    } catch (jsonError) {
                        console.error('📁 JSON回退也失败:', jsonError);
                        throw error;
                    }
                } else {
                    throw error;
                }
            }
        }
        
        // 渲染马拉松内容
        function renderMarathon() {
            if (!marathonData) {
                console.error('马拉松数据未加载');
                return;
            }
            
            console.log('📊 马拉松数据结构:', marathonData);
            
            // 显示统计数据
            displayMarathonStats();
            
            // 显示比赛记录
            displayRaces();
        }
        
        function displayMarathonStats() {
            const stats = marathonData.statistics;
            console.log('📈 统计数据:', stats);
            
            document.getElementById('total-races').textContent = stats?.totalRaces || '0';
            document.getElementById('total-distance').textContent = stats?.totalDistance || '0';
            document.getElementById('monthly-distance').textContent = stats?.monthlyDistance || '0';
        }
        
        function displayRaces() {
            const container = document.getElementById('races-container');
            const races = marathonData.races;
            
            container.innerHTML = races.map(race => `
                <div class="race-card">
                    <div class="race-header">
                        <h4>${race.name}</h4>
                        <span class="race-date">${race.date}</span>
                    </div>
                    <div class="race-details">
                        <div class="race-info">
                            <p><strong>地点：</strong>${race.location}</p>
                            <p><strong>距离：</strong>${race.distance}</p>
                            <p><strong>成绩：</strong>${race.time}</p>
                            <p><strong>排名：</strong>${race.ranking}/${race.totalParticipants}</p>
                            <p><strong>天气：</strong>${race.weather}</p>
                        </div>
                        ${race.certificate ? `<div class="race-images">
                            <img src="${race.certificate.startsWith('http') ? race.certificate : '../../' + race.certificate}" alt="比赛证书" class="race-image" onerror="this.style.display='none'">
                            ${race.medal ? `<img src="${race.medal.startsWith('http') ? race.medal : '../../' + race.medal}" alt="奖牌" class="race-image" onerror="this.style.display='none'">` : ''}
                        </div>` : ''}
                    </div>
                    <div class="race-experience">
                        <h5>比赛感受</h5>
                        <p>${race.experience}</p>
                    </div>
                </div>
            `).join('');
        }
        
    </script>
