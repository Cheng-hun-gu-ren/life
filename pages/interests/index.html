    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // 先加载数据（调整子页面路径）
                await loadSubPageData();
                
                // 初始化页面功能
                initTabs();
                
                // 渲染内容
                renderBooks();
                renderMovies(); 
                renderMusic();
                
                console.log('兴趣爱好页面初始化完成');
            } catch (error) {
                console.error('页面初始化失败:', error);
            }
        });
        
        // 子页面数据加载函数
        async function loadSubPageData() {
            try {
                const [books, movies, music, marathon] = await Promise.all([
                    loadJSON('../../data/books.json'),
                    loadJSON('../../data/movies.json'),
                    loadJSON('../../data/music.json'),
                    loadJSON('../../data/marathon.json')
                ]);
                
                // 修正图片路径
                booksData = fixImagePaths(books);
                moviesData = fixImagePaths(movies);
                musicData = fixImagePaths(music);
                marathonData = marathon;
                
                console.log('子页面数据加载完成');
            } catch (error) {
                console.error('数据加载失败:', error);
                throw error;
            }
        }
        
        // 修正图片路径的函数
        function fixImagePaths(data) {
            if (!data) return data;
            
            function fixPath(item) {
                if (item.cover && !item.cover.startsWith('../../')) {
                    item.cover = '../../' + item.cover;
                }
                if (item.poster && !item.poster.startsWith('../../')) {
                    item.poster = '../../' + item.poster;
                }
                if (item.albumCover && !item.albumCover.startsWith('../../')) {
                    item.albumCover = '../../' + item.albumCover;
                }
                return item;
            }
            
            // 处理不同的数据结构
            if (data.currentReading) {
                data.currentReading = data.currentReading.map(fixPath);
            }
            if (data.recentlyFinished) {
                data.recentlyFinished = data.recentlyFinished.map(fixPath);
            }
            if (data.recentWatched) {
                data.recentWatched = data.recentWatched.map(fixPath);
            }
            if (data.currentListening) {
                data.currentListening = data.currentListening.map(fixPath);
            }
            if (data.playlists) {
                data.playlists = data.playlists.map(playlist => {
                    if (playlist.cover && !playlist.cover.startsWith('../../')) {
                        playlist.cover = '../../' + playlist.cover;
                    }
                    return playlist;
                });
            }
            
            return data;
        }
    </script>
