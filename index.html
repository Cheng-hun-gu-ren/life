<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨昏故人的小世界</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="landing-page">
    <div class="landing-container">
        <!-- 背景装饰 -->
        <div class="bg-decoration">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
            <div class="star star-1"></div>
            <div class="star star-2"></div>
            <div class="star star-3"></div>
            <div class="star star-4"></div>
        </div>

        <!-- 主要内容 -->
        <div class="landing-content">
            <div class="avatar-container">
                <div class="avatar-placeholder">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="60" cy="60" r="60" fill="#4ECDC4" opacity="0.3"/>
                        <circle cx="60" cy="45" r="20" fill="#4ECDC4"/>
                        <path d="M25 95 C25 75, 40 65, 60 65 C80 65, 95 75, 95 95" fill="#4ECDC4"/>
                    </svg>
                </div>
            </div>
            
            <h1 class="name">晨昏故人</h1>
            <p class="intro">22岁 | 深圳 | 金融工程研究生</p>
            <p class="welcome">欢迎来到我的小世界 ✨</p>
            
            <button class="enter-btn" onclick="enterSite()">
                <span>ENTER</span>
                <div class="btn-decoration">
                    <div class="heart">♡</div>
                </div>
            </button>
        </div>
    </div>

    <script src="js/animations.js"></script>
    <script>
        function enterSite() {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 800);
        }

        // 初始化页面动画
        document.addEventListener('DOMContentLoaded', function() {
            initLandingAnimations();
        });
    </script>
</body>
</html>
