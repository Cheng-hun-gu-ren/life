<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨昏故人的小世界 - 微动效增强版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --text-color: #f9fafb;
            --text-muted-color: #d1d5db;
            --font-sans: 'Noto Sans SC', sans-serif;
            --font-serif: 'Noto Serif SC', serif;
            --glow-color: #60a5fa;
            --accent-color: #facc15;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: opacity 0.8s ease-in-out;
            perspective: 1000px;
        }

        body.fade-out {
            opacity: 0;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            transition: transform 0.1s ease-out;
        }

        /* Background Aurora Effect */
        .background-aurora {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .aurora-shape {
            position: absolute;
            border-radius: 9999px;
            filter: blur(120px);
            opacity: 0.25;
            animation: float 30s infinite ease-in-out;
        }

        .shape-1 {
            top: 10%; left: 15%; width: 28rem; height: 28rem;
            background-color: #3b82f6;
            animation-duration: 25s; animation-delay: 0s;
        }

        .shape-2 {
            bottom: 10%; right: 15%; width: 32rem; height: 32rem;
            background-color: #ec4899;
            animation-duration: 30s; animation-delay: -15s;
        }
        
        .shape-3 {
            bottom: 30%; left: 25%; width: 20rem; height: 20rem;
            background-color: #8b5cf6;
            animation-duration: 35s; animation-delay: -5s;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(60px, -40px) rotate(180deg) scale(1.2); }
            100% { transform: translate(0, 0) rotate(360deg) scale(1); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(96, 165, 250, 0.5),
                            0 0 40px rgba(96, 165, 250, 0.3),
                            0 0 60px rgba(96, 165, 250, 0.1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(96, 165, 250, 0.6),
                            0 0 50px rgba(96, 165, 250, 0.4),
                            0 0 70px rgba(96, 165, 250, 0.2);
            }
        }

        @keyframes sparkle-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes text-shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* Enhanced Content Styles */
        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 9999px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            animation: fade-in-up 0.8s ease-out forwards, pulse-glow 3s ease-in-out infinite;
            opacity: 0;
            transition: transform 0.2s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
            object-fit: cover;
            cursor: pointer;
            position: relative;
        }

        .avatar:hover {
            border-color: rgba(96, 165, 250, 0.5);
            transform: scale(1.05);
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 9999px;
            padding: 2px;
            background: linear-gradient(45deg, #3b82f6, #ec4899, #8b5cf6);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar:hover::after {
            opacity: 1;
            animation: sparkle-rotate 3s linear infinite;
        }
        
        h1 {
            font-size: 3.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin: 0;
            cursor: default;
            animation: fade-in-up 0.8s 0.2s ease-out forwards;
            opacity: 0;
            background: linear-gradient(180deg, #ffffff 0%, #ffffff 50%, #d1d5db 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            transition: all 0.3s ease;
        }

        h1::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, var(--glow-color) 50%, transparent 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            animation: text-shimmer 3s ease-in-out infinite;
            transition: opacity 0.3s ease;
        }

        h1:hover::before {
            opacity: 0.5;
        }

        .subtitle {
            font-family: var(--font-serif);
            font-size: 1.125rem;
            color: var(--text-muted-color);
            max-width: 36rem;
            margin-top: 1rem;
            animation: fade-in-up 0.8s 0.4s ease-out forwards;
            opacity: 0;
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glow-color), transparent);
            transition: width 0.8s ease;
        }

        .container:hover .subtitle::after {
            width: 100%;
        }

        .welcome-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            color: var(--text-color);
            margin-top: 1.5rem;
            animation: fade-in-up 0.8s 0.6s ease-out forwards;
            opacity: 0;
        }

        .welcome-text .sparkle {
            color: var(--accent-color);
            width: 1.25rem;
            height: 1.25rem;
            filter: drop-shadow(0 0 5px var(--accent-color));
            animation: sparkle-rotate 5s linear infinite;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .welcome-text:hover .sparkle {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px var(--accent-color));
        }

        .enter-button {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 2.5rem;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            padding: 1rem 2rem;
            font-size: 1.125rem;
            text-decoration: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            animation: fade-in-up 0.8s 0.8s ease-out forwards;
            opacity: 0;
            cursor: pointer;
            font-family: var(--font-sans);
        }

        .enter-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(96, 165, 250, 0.25);
        }
        
        .enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-30deg);
            transition: left 0.7s ease-in-out;
        }

        .enter-button:hover::before {
            left: 100%;
        }

        .enter-button::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 9999px;
            padding: 1px;
            background: linear-gradient(45deg, transparent, var(--glow-color), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .enter-button:hover::after {
            opacity: 1;
            animation: sparkle-rotate 2s linear infinite;
        }

        .enter-button .arrow {
            margin-left: 0.5rem;
            width: 1.25rem;
            height: 1.25rem;
            transition: transform 0.3s ease;
        }
        
        .enter-button:hover .arrow {
            transform: translateX(4px);
        }

        /* Floating particles */
        .floating-particle {
            position: fixed;
            pointer-events: none;
            opacity: 0;
            animation: float-particle 10s ease-in-out infinite;
        }

        @keyframes float-particle {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(10vh) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(0vh) scale(0);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .subtitle, .welcome-text, .enter-button { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="background-aurora">
        <div class="aurora-shape shape-1"></div>
        <div class="aurora-shape shape-2"></div>
        <div class="aurora-shape shape-3"></div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <img src="https://personl-website.oss-cn-shenzhen.aliyuncs.com/life-images-upload/icons/avatar-main.png" alt="晨昏故人 头像" class="avatar">

        <h1 data-text="晨昏故人">晨昏故人</h1>

        <p class="subtitle">书卷多情似故人，晨昏忧乐每相亲</p>

        <p class="welcome-text">
            <svg class="sparkle" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <span>欢迎来到我的小世界</span>
            <svg class="sparkle" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </p>

        <button class="enter-button" onclick="enterSite()">
            进入世界
            <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Function to handle page transition
        function enterSite() {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 800);
        }

        // 跳转到后台上传页
        function goToAdminUpload() {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = '/admin-upload.html';
            }, 800);
        }

        // Create floating particles
        function createFloatingParticles() {
            const particleCount = 5;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'floating-particle';
                particle.innerHTML = '✨';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.fontSize = Math.random() * 10 + 10 + 'px';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 10) + 's';
                document.body.appendChild(particle);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createFloatingParticles();

            // --- 1. 3D Parallax effect for the container ---
            const container = document.querySelector('.container');
            if (window.innerWidth > 768) {
                document.body.addEventListener('mousemove', (e) => {
                    const { clientX, clientY } = e;
                    const { innerWidth, innerHeight } = window;
                    const xRotation = (clientY / innerHeight - 0.5) * -10;
                    const yRotation = (clientX / innerWidth - 0.5) * 10;
                    container.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
                });
            }

            // --- 2. Particle background effect ---
            let scene, camera, renderer, points, material;
            let mouseX = 0, mouseY = 0;

            function initParticles() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 5;

                const canvas = document.getElementById('bg-canvas');
                renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const particlesCount = 7000;
                const positions = new Float32Array(particlesCount * 3);
                const colors = new Float32Array(particlesCount * 3);
                
                for (let i = 0; i < particlesCount * 3; i++) {
                    positions[i] = (Math.random() - 0.5) * 10;
                }
                
                // Add subtle color variation
                for (let i = 0; i < particlesCount; i++) {
                    const i3 = i * 3;
                    colors[i3] = 0.5 + Math.random() * 0.5;
                    colors[i3 + 1] = 0.5 + Math.random() * 0.5;
                    colors[i3 + 2] = 1;
                }
                
                const particlesGeometry = new THREE.BufferGeometry();
                particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                material = new THREE.PointsMaterial({
                    size: 0.015,
                    sizeAttenuation: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true
                });
                points = new THREE.Points(particlesGeometry, material);
                scene.add(points);

                window.addEventListener('resize', onWindowResize, false);
                document.addEventListener('mousemove', onDocumentMouseMove, false);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function onDocumentMouseMove(event) {
                mouseX = (event.clientX - window.innerWidth / 2) / 100;
                mouseY = (event.clientY - window.innerHeight / 2) / 100;
            }

            function animateParticles() {
                requestAnimationFrame(animateParticles);
                const time = Date.now() * 0.0005;

                points.rotation.y = time * 0.1;
                points.rotation.x = time * 0.05;
                
                camera.position.x += (mouseX - camera.position.x) * 0.05;
                camera.position.y += (-mouseY - camera.position.y) * 0.05;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }

            initParticles();
            animateParticles();

            // --- 3. Interactive Avatar ---
            const avatar = document.querySelector('.avatar');
            const avatarRect = avatar.getBoundingClientRect();
            const avatarCenterX = avatarRect.left + avatarRect.width / 2;
            const avatarCenterY = avatarRect.top + avatarRect.height / 2;

            avatar.addEventListener('click', () => {
                goToAdminUpload();
            });

            document.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                const dx = clientX - avatarCenterX;
                const dy = clientY - avatarCenterY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                const maxDist = 300;
                if (dist < maxDist) {
                    const force = 1 - (dist / maxDist);
                    const moveX = (dx / dist) * force * 15;
                    const moveY = (dy / dist) * force * 15;
                    const scale = 1 + force * 0.1;
                    avatar.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
                } else {
                    avatar.style.transform = 'translate(0,0) scale(1)';
                }
            });
        });
    </script>

</body>
</html>
